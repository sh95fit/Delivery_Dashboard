name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/lunchlab/Delivery_Dashboard

            echo "== 0) 권한 보정 (deploy가 읽을 수 있도록) =="
            sudo chown deploy:deploy /opt/lunchlab/Delivery_Dashboard/.env 2>/dev/null || true
            sudo chown -R deploy:deploy /opt/lunchlab 2>/dev/null || true

            echo "== 1) 최신 코드 반영 =="
            git checkout -- . 2>/dev/null || true
            git pull origin main

            echo "== 2) 이미지 빌드 + 컨테이너 교체 (볼륨 유지) =="
            docker compose build
            docker compose up -d --remove-orphans

            echo "== 3) DB 볼륨 확인 =="
            docker volume ls | grep dash_db_data || echo "WARN: dash_db_data 볼륨 없음"

            echo "== 3.5) dash DB 마이그레이션 =="
            docker compose exec -T backend python -m app.db_migrate

            echo "== 4) 헬스체크 =="
            for i in $(seq 1 5); do
              if curl -sf http://127.0.0.1:8100/health >/dev/null; then
                echo "health OK"; break
              fi
              echo "waiting... ($i)"; sleep 3
            done

            echo "== 5) 오래된 이미지 정리 =="
            docker image prune -f || true
