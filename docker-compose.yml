services:
  backend:
    build: ./backend
    container_name: dash_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      - ENV=prod
    env_file:
      - .env

  db:
    image: postgres:16-alpine
    container_name: dash_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-delivery_dashboard}
      - POSTGRES_USER=${POSTGRES_USER:-dash_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dash_pass_change_me}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dash_db_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_NAVER_MAP_KEY_ID: ${VITE_NAVER_MAP_KEY_ID:-}
    container_name: dash_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:80"

  redis:
    image: redis:7-alpine
    container_name: dash_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"

  route_worker:
    build: ./backend
    container_name: dash_route_worker
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.route_collector"]
    depends_on:
      - db
      - redis

volumes:
  dash_db_data:
